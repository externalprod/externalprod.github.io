<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      padding: 50px;
    }
    .button {
      font-size: 30px;
      padding: 20px 40px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 20px;
    }
    .button:hover {
      background-color: #45a049;
    }
    .counter {
      font-size: 40px;
      margin-top: 20px;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Clicker Game</h1>
  <p>Click the button to earn points!</p>

  <button class="button" onclick="earnPoints()">Click Me!</button>

  <div class="counter">
    <p>Points: <span id="pointCounter">0</span></p>
  </div>

  <script>
    let points = 0;

    // Function to handle point earning on click
    function earnPoints() {
      points++;
      document.getElementById('pointCounter').textContent = points;
    }
  </script>

</body>
</html>
